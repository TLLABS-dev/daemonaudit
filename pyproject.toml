[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daemonaudit"
version = "0.1.0"
description = "Red/blue security audit for self-hosted AI agent daemons. Finds the secrets, the open doors, and the blast radius."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "TL" }]
keywords = ["security", "audit", "ai-agent", "hermes", "openclaw", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "psutil>=5.9",
  "rich>=13",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
daemonaudit = "daemonaudit.cli:main"

[project.urls]
Homepage = "https://github.com/TLLABS-dev/daemonaudit"

[tool.hatch.build.targets.wheel]
packages = ["src/daemonaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
