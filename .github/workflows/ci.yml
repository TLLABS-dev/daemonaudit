name: ci
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: smoke-scan a demo home
        shell: bash
        run: |
          python scripts/demo_home.py demo-hermes
          daemonaudit scan --red --home demo-hermes --json out.json --html out.html || test $? -eq 2
          python -c "import json; d=json.load(open('out.json', encoding='utf-8')); assert d['summary']['attack_paths'] >= 1, d['summary']"
          python scripts/demo_home.py demo-openclaw --openclaw
          daemonaudit scan --red --home demo-openclaw --json oc.json --html oc.html || test $? -eq 2
          python -c "import json; d=json.load(open('oc.json', encoding='utf-8')); assert d['targets'][0]['framework'] == 'openclaw' and d['summary']['attack_paths'] >= 1, d['summary']"
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }
  # Publishes to PyPI via Trusted Publishing (OIDC — no API token stored).
  # One-time setup on pypi.org before the first release can publish: see below.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # mint the OIDC token PyPI trusts; no secrets needed
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
